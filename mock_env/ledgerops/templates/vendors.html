{% extends "base.html" %}
{% block title %}Vendors{% endblock %}
{% block content %}
<h1>Vendors</h1>
<table id="vendors-table">
  <thead><tr><th>ID</th><th>Name</th><th>Contact email</th></tr></thead>
  <tbody>
  {% for v in vendors %}<tr><td>{{ v.id }}</td><td>{{ v.name }}</td><td>{{ v.email }}</td></tr>{% endfor %}
  </tbody>
</table>
{% endblock %}
