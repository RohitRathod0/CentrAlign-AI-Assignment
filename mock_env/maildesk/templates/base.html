{# Shared layout for MailDesk pages. Errors use role="alert" and success banners
   role="status" so the agent's page classifier can tell them apart generically. #}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}MailDesk{% endblock %} - MailDesk</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #f4f6fb; color: #1d2433; }
    header { background: #2b4acb; color: #fff; padding: 12px 24px; display: flex; gap: 24px; align-items: center; }
    header a { color: #fff; text-decoration: none; }
    header .brand { font-weight: 700; font-size: 18px; }
    main { max-width: 960px; margin: 24px auto; background: #fff; padding: 24px; border-radius: 8px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 8px; border-bottom: 1px solid #e3e7f0; }
    label { display: block; margin-top: 12px; font-weight: 600; }
    input, textarea, select { width: 100%; padding: 8px; box-sizing: border-box; }
    button { margin-top: 16px; padding: 8px 16px; background: #2b4acb; color: #fff; border: 0; border-radius: 4px; cursor: pointer; }
    .error { color: #b00020; margin: 8px 0; }
    .ok { background: #e3f6e8; color: #145c2c; padding: 8px; border-radius: 4px; }
    pre { white-space: pre-wrap; font-family: inherit; }
  </style>
</head>
<body>
  <header>
    <span class="brand">MailDesk</span>
    <a href="/inbox" id="nav-inbox">Inbox</a>
    <a href="/compose" id="nav-compose">Compose</a>
    <a href="/sent" id="nav-sent">Sent</a>
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
